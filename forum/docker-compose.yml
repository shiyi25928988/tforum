# tForum Docker Compose
version: "3.8"

services:
  forum-backend:
    image: forum:latest
    container_name: forum-backend
    ports:
      - "8081:8081"
    environment:
      # 服务器
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=dev
      # MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://127.0.0.1:3306/tforum?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      # Redis
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD=123456
      - REDIS_DATABASE=1
      # MinIO (可选)
      - MINIO_HOST=127.0.0.1
      - MINIO_PORT=9000
      - MINIO_BUCKET=tforum
      - MINIO_USERNAME=minioadmin
      - MINIO_PASSWORD=minioadmin
      - MINIO_ISHTTPS=false
      # Lucene
      - LUCENE_STORAGE_PATH=/data/lucene
      # AI / OpenAI (配置你的 API Key)
      - SPRING_AI_OPENAI_BASE_URL=
      - SPRING_AI_OPENAI_API_KEY=
      - SPRING_AI_OPENAI_CHAT_MODEL=
      - SPRING_AI_OPENAI_EMBEDDING_MODEL=
      # Milvus (可选)
      - SPRING_AI_VECTORSTORE_MILVUS_CLIENT_HOST=127.0.0.1
      - SPRING_AI_VECTORSTORE_MILVUS_CLIENT_PORT=19530
      - SPRING_AI_VECTORSTORE_MILVUS_CLIENT_DATABASE_NAME=default
      - SPRING_AI_VECTORSTORE_MILVUS_CLIENT_COLLECTION_NAME=tforum
    volumes:
      - lucene-data:/data/lucene
    restart: unless-stopped

  forum-frontend:
    image: forum-fe:latest
    container_name: forum-frontend
    ports:
      - "80:80"
    depends_on:
      - forum-backend
    restart: unless-stopped

volumes:
  lucene-data:
